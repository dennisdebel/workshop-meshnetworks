    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "3162237439", "label": "3162237439", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "2882848806", "label": "2882848806", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "2880712319", "label": "2880712319", "shape": "dot", "size": 10}]);
                  edges = new vis.DataSet([{"color": "orange", "from": "3162237439", "rssi": 31, "title": "31 dBm", "to": "2882848806", "width": 1}, {"color": "orange", "from": "3162237439", "rssi": 31, "title": "31 dBm", "to": "2880712319", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"enabled": true, "solver": "forceAtlas2Based", "forceAtlas2Based": {"gravitationalConstant": -80, "centralGravity": 0.01, "springLength": 150, "springConstant": 0.05}, "stabilization": {"enabled": true, "iterations": 200}}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    

<script>


network.once(
"stabilizationIterationsDone",
function(){

    let pos=network.getPositions();


    fetch("positions.json",
    {
        method:"POST",
        body:JSON.stringify(pos)
    });

});

</script>
