<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TOP WEBRING HEADER BAR -->
    <div id="mesh-header">
        <div class="header-title">+--- MESH WEBRING ---+</div>
        <div class="header-info">
            <strong>Current Node:</strong> <span id="myNode">loading...</span>
        </div>
        <div class="header-info">
            <strong>Connected Nodes:</strong>
            <span id="nodes">loading...</span>
        </div>
    </div>

    <!-- MAIN NODE CONTENT -->
    <main id="node-content">
        <pre>
<h1>Welcome to Node A</h1>
<p>This is the default homepage for this mesh node.</p>
<img src="nodea.jpg" alt="Node Image">
        </pre>
    </main>

    <script src="app.js"></script>
</body>
</html>
